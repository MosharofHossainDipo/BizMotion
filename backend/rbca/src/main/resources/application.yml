spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: bizmotion
    password: Bizmotion@123
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  flyway:
    enabled: false

jwt:
  secret: bizmotion-super-secret-key-must-be-256-bits-long-padded-here
  expiration: 86400000
  refresh-expiration: 604800000


servlet:
  multipart:
      max-file-size: 10MB
      max-request-size: 10MB


server:
  port: 8080

logging:
  level:
    com.bizmotion: INFO

