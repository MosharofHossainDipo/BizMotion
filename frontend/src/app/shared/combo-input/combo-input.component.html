<div class="combo-wrap">
  <input
    class="combo-input"
    type="text"
    [placeholder]="placeholder"
    [value]="value"
    (input)="onInput($any($event.target).value)"
    (focus)="onFocus()"
    [disabled]="disabled"
  />
  <button type="button" class="combo-chevron" (click)="toggleOpen()" [disabled]="disabled">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" [style.transform]="open ? 'rotate(180deg)' : 'none'">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
  <div class="combo-list" *ngIf="open && filteredOptions.length > 0">
    <div class="combo-option" *ngFor="let opt of filteredOptions" (mousedown)="selectOption(opt)">{{ opt }}</div>
  </div>
  <div class="combo-list" *ngIf="open && filteredOptions.length === 0 && options.length > 0">
    <div class="combo-empty">No matches — your typed text will be used as a new value</div>
  </div>
</div>
